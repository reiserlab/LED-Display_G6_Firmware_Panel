# PR/push CI: host-side unit tests plus the same catalog build that a release
# runs (build-only; nothing is published). Complements release.yml, which only
# fires on panel-fw-v* tags. Uses the pixi-pinned toolchain so CI matches
# `pixi run test` / `pixi run release` locally; `locked: true` fails the build
# if pixi.lock is stale instead of silently re-solving.
name: ci

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      - name: Unit tests (native)
        run: pixi run test

      - name: Build firmware catalog
        run: pixi run release
