; PlatformIO Project Configuration File
;
; Two hardware revisions supported via build-time -DPANEL_REV:
;   pico_v021 -> G6 panel v0.2.1 (COL GP1-20, ROW GP21-31+GP36-44, SPI0 GP32-35, PSRAM CS GP0)
;   pico_v031 -> G6 panel v0.3.1 (COL GP0-19, ROW GP20-39 contiguous, SPI1 GP40-43, PSRAM CS GP47)
;
; Both panels use NORMAL LED polarity (col HIGH + row LOW = ON).
; Select target: pio run -e pico_v021  or  pio run -e pico_v031
;
; See docs/development/g6_02-led-mapping.md (Modular-LED-Display repo) for full pin tables.


[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ArduinoEigen
    Streaming

; Flash Size: 2MB (No FS)
board_build.filesystem_size = 0m

; PSRAM size: 8MB (both revisions use APS6404L-3SQR)
board_upload.psram_length = 8388608

; USB identity
board_build.arduino.earlephilhower.usb_manufacturer = Reiser Lab
board_build.arduino.earlephilhower.usb_product = RP2354 20x20 Display Panel
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
; USB device id
;   0x0009 = USB serial device  (flashing/debugging)
;   0x000f = USB mass storage device (bootloader mode)
board_build.arduino.earlephilhower.usb_pid = 0x0009


[env:pico_v021]
extends = common
; PSRAM CS (XIP_CS1n) is on GP0 in v0.2.1
build_flags =
    -DPANEL_REV=21
    -DRP2350_PSRAM_CS=0


[env:pico_v031]
extends = common
; PSRAM CS moved to GP47 in v0.3.1 to free GP0 for column 0
build_flags =
    -DPANEL_REV=31
    -DRP2350_PSRAM_CS=47
