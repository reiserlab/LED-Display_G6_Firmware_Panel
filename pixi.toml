[workspace]
authors = ["Frank Loesche <loeschef@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "Panel-Firmware"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.2.0"

[tasks]
# Build the firmware catalog into dist/ (UF2 + ISP .bin + manifest.json).
# See README.md "Build" for how the catalog is discovered and what CI publishes.
release = "python panel/tools/build_release.py"
diag    = "python panel/tools/build_release.py --group diag"

# Flash every connected panel of a rev. See README.md "Flash & monitor".
flash21                = { cmd = "python panel/tools/g6_flash.py --rev v0.2.1 --uf2 dist/g6-panel-v0.2.1.uf2", depends-on = ["release"] }
flash31                = { cmd = "python panel/tools/g6_flash.py --rev v0.3.1 --uf2 dist/g6-panel-v0.3.1.uf2", depends-on = ["release"] }
flash21-github-release = "python panel/tools/g6_flash.py --rev v0.2.1"
flash31-github-release = "python panel/tools/g6_flash.py --rev v0.3.1"

# Open a serial console on one panel by USB serial number. See README.md
# "Flash & monitor".
monitor = "python panel/tools/monitor.py"

# Host-side unit tests (panel/test/): pure ISP logic from src/isp_logic.h.
# No hardware needed. Uses the SYSTEM C++ compiler (any C++17 g++/clang++ on
# PATH), deliberately NOT conda-forge's cxx-compiler: conda compilers bake the
# environment prefix into their link inputs, which breaks when the checkout
# path contains a space (as this repo's parent "Generation 6" does).
test = "platformio test -d panel -e native"

[dependencies]
platformio = ">=6.1.19,<7"
python = ">=3.9"
