# Panel-firmware release: build every selectable firmware build and publish them
# (plus a manifest catalog) as GitHub Release assets AND to this repo's GitHub
# Pages, so g6-flash (CLI) and the WebUSB flasher never need a PlatformIO
# toolchain.
#
# The catalog isn't hardcoded here or in build_release.py — it's discovered
# from panel/platformio.ini (envs that `extends = common`; see that script's
# discover_catalog()). The `pixi run release` build step below is the SAME
# command a developer runs locally to preview a release before tagging; it
# always builds BOTH the UF2 and the ISP .bin for every entry. Add a new
# hardware rev by adding a `[env:pico_v0XX]` extending `common` to
# platformio.ini — it flows through to the GitHub Release, GitHub Pages, the
# flasher dropdown, and g6-flash's --variant automatically via manifest.json.
# (Bench/diagnostic envs that extend another pico_v* env instead go to the
# separate `diag` task, which this workflow never runs.)
#
# Tag a release to trigger:   git tag panel-fw-v1.0.0 && git push origin panel-fw-v1.0.0
name: release

on:
  push:
    tags: ["panel-fw-v*"]
  workflow_dispatch: {}

permissions:
  contents: write  # create the GitHub Release + upload assets
  pages: write     # publish manifest.json + UF2s to this repo's GitHub Pages
  id-token: write  # required by actions/deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pixi.toml pins both python and platformio; installing pixi and running
      # through it (instead of a separate pip install here) keeps CI on the
      # exact same toolchain versions as `pixi run release` locally. `locked:
      # true` fails the build if pixi.lock is stale instead of silently
      # re-solving to different versions.
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          locked: true

      - name: Build release catalog
        run: pixi run release

      - uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: incoming
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            incoming/g6-panel-*.uf2
            incoming/g6-panel-*.bin
            incoming/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Publish the same manifest + UF2s + ISP bins to THIS repo's GitHub Pages.
  # Release-asset downloads are not CORS-accessible, so the browser flasher
  # can't fetch() them; this Pages site and the flasher share the
  # reiserlab.github.io origin, so it reads firmware here with no CORS. The
  # g6-flash CLI uses the Release instead.
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: incoming
      - name: Assemble Pages site (manifest.json + UF2s + bins, not build metadata)
        run: |
          mkdir -p site
          cp incoming/g6-panel-*.uf2 site/
          cp incoming/g6-panel-*.bin site/
          cp incoming/manifest.json site/
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>G6 Panel firmware</title>
          <h1>G6 Panel firmware artifacts</h1>
          <p>Machine-readable catalog: <a href="manifest.json">manifest.json</a>.
          Served same-origin for the
          <a href="https://reiserlab.github.io/webDisplayTools/flasher/">WebUSB panel flasher</a>;
          the <code>g6-flash</code> CLI pulls from the GitHub Release instead.</p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
