; PlatformIO Project Configuration File — panel_controller (bench harness)
;
; Turns a G6 panel into a stand-in SPI bus controller for V1 wire-protocol
; bench validation. One panel runs `panel/` peripheral firmware; another panel
; runs this `panel_controller/` firmware and drives it.
;
; Shared protocol/message/pattern code is pulled in from ../panel/src/ via
; build_src_filter (cross-platform; no symlinks). PANEL_REV selects which
; SPI peripheral and pins the controller drives.


[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ArduinoEigen
    Streaming

; PSRAM not used by the controller, but the board has it on the same pins so we
; still set the chip-select correctly to avoid stray bus activity.
board_upload.psram_length = 8388608
board_build.filesystem_size = 0m

; USB identity
board_build.arduino.earlephilhower.usb_manufacturer = Reiser Lab
board_build.arduino.earlephilhower.usb_product = G6 Panel-as-Controller Bench Harness
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
board_build.arduino.earlephilhower.usb_pid = 0x0009

; Pull in shared protocol/message/pattern sources from the peripheral firmware tree.
; This is the cross-platform alternative to symlinks (works on Windows + CI).
build_src_filter =
    +<*>
    +<../../panel/src/constants.cpp>
    +<../../panel/src/message.cpp>
    +<../../panel/src/pattern.cpp>
    +<../../panel/src/protocol.cpp>
build_flags =
    -I../panel/src


[env:pico_controller_v021]
extends = common
; Same panel hardware as the peripheral; just configured as controller instead of peripheral.
build_flags =
    ${common.build_flags}
    -DPANEL_REV=21
    -DRP2350_PSRAM_CS=0


[env:pico_controller_v031]
extends = common
build_flags =
    ${common.build_flags}
    -DPANEL_REV=31
    -DRP2350_PSRAM_CS=47
