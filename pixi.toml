[workspace]
authors = ["Frank Loesche <loeschef@janelia.hhmi.org>"]
channels = ["conda-forge"]
name = "Panel-Firmware"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
# deploy21 / deploy31: flash ALL connected panels of that revision in parallel.
# Boards must already be running firmware with the current USB product strings
# (G6 Panel v0.2 / G6 Panel v0.3). Bootstrap a board with the old product
# string using `pio run -d panel -e pico_v021 -t upload` (picotool auto-detect).
#
# deploy21a / deploy31a: target a SPECIFIC panel by USB serial number.
# Find a board's serial with:
#   ls /dev/serial/by-id/usb-Reiser_Lab_G6_Panel_v0.2_*-if00
deploy21       = "bash panel/tools/deploy_all.sh pico_v021"
deploy31       = "bash panel/tools/deploy_all.sh pico_v031"
deploy21a      = "bash panel/tools/deploy.sh 319A5199EE357F77 pico_v021"
deploy31a      = "bash panel/tools/deploy.sh A5D4B82BA2B9FB51 pico_v031"
deploy21a-diag = "bash panel/tools/deploy.sh 319A5199EE357F77 pico_v021_spidiag"
deploy31a-diag = "bash panel/tools/deploy.sh A5D4B82BA2B9FB51 pico_v031_spidiag"
monitor21a     = "bash panel/tools/monitor.sh 319A5199EE357F77"
monitor31a     = "bash panel/tools/monitor.sh A5D4B82BA2B9FB51"

# flash21 / flash31: rev-aware flashing of NEW/blank *and* running panels via
# picotool (g6_flash.py reboots a running board into BOOTSEL itself, flashes
# blank/BOOTSEL boards directly, and verifies the USB product string after).
# Unlike deploy*, the hardware rev — not a USB serial — selects the binary, so
# this also programs brand-new panels. Flashes the latest published firmware
# release by default; pass --uf2 <path> for a local build.
# NOTE: requires `picotool` on PATH. picotool is NOT a conda-forge package, so
# it is not pinned here — install it from your OS package manager, or reuse the
# copy PlatformIO already vendors at ~/.platformio/packages/tool-picotool*/.
flash21        = "python panel/tools/g6_flash.py --rev v0.2.1"
flash31        = "python panel/tools/g6_flash.py --rev v0.3.1"

[dependencies]
platformio = ">=6.1.19,<7"
