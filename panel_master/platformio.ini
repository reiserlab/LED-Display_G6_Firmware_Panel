; PlatformIO Project Configuration File — panel_master (bench harness)
;
; Turns a G6 panel into a fake controller (SPI master) for V1 wire-protocol
; bench validation. One panel runs `panel/` slave firmware; another panel
; runs this `panel_master/` firmware and drives it.
;
; Shared protocol/message/pattern code is pulled in from ../panel/src/ via
; build_src_filter (cross-platform; no symlinks). PANEL_REV selects which
; SPI peripheral and pins the master drives.


[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ArduinoEigen
    Streaming

; PSRAM not used by the master, but the board has it on the same pins so we
; still set the chip-select correctly to avoid stray bus activity.
board_upload.psram_length = 8388608
board_build.filesystem_size = 0m

; USB identity
board_build.arduino.earlephilhower.usb_manufacturer = Reiser Lab
board_build.arduino.earlephilhower.usb_product = G6 Panel-as-Master Bench Harness
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
board_build.arduino.earlephilhower.usb_pid = 0x0009

; Pull in shared protocol/message/pattern sources from the slave firmware tree.
; This is the cross-platform alternative to symlinks (works on Windows + CI).
build_src_filter =
    +<*>
    +<../../panel/src/constants.cpp>
    +<../../panel/src/message.cpp>
    +<../../panel/src/pattern.cpp>
    +<../../panel/src/protocol.cpp>
build_flags =
    -I../panel/src


[env:pico_master_v021]
extends = common
; Same panel hardware as the slave; just configured as master instead of slave.
build_flags =
    ${common.build_flags}
    -DPANEL_REV=21
    -DRP2350_PSRAM_CS=0


[env:pico_master_v031]
extends = common
build_flags =
    ${common.build_flags}
    -DPANEL_REV=31
    -DRP2350_PSRAM_CS=47
