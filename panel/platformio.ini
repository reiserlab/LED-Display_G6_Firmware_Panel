; PlatformIO Project Configuration File
;
; Two hardware revisions supported via build-time -DPANEL_REV:
;   pico_v021 -> G6 panel v0.2.1 (COL GP1-20, ROW GP21-31+GP36-44, SPI0 GP32-35, PSRAM CS GP0)
;   pico_v031 -> G6 panel v0.3.1 (COL GP0-19, ROW GP20-39 contiguous, SPI1 GP40-43, PSRAM CS GP47)
;
; Both panels use NORMAL LED polarity (col HIGH + row LOW = ON).
; Select target: pio run -e pico_v021  or  pio run -e pico_v031
;
; See docs/development/g6_02-led-mapping.md (Modular-LED-Display repo) for full pin tables.


[common]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
lib_deps =
    ArduinoEigen
    Streaming

; Generate predefined-pattern blob + slot-constant header into src/ before
; SCons enumerates source files. Outputs:
;   src/predef_patterns_blob.h   (uint8_t array; #include'd by predef_patterns.cpp)
;   src/predef_patterns_table.h  (slot-constant header; #include'd everywhere)
;   src/predef_patterns.bin      (debug artifact; not compiled in)
extra_scripts = pre:tools/gen_predef_patterns.py

; Flash size: 2 MiB on-package (RP2354B has 2 MiB stacked flash; see BOM U2
; = RP2354B_80QFN, LCSC C39843328). The auto-generated linker's 16 MB
; LENGTH is a `generic_rp2350` boilerplate that doesn't match the physical
; chip. Cap the firmware size at the true 2 MiB so oversize images fail
; the build instead of failing at upload.
;
; LittleFS region (512 KiB at the top of flash) is REQUIRED for ISP firmware
; update: the panel stages the incoming image as a LittleFS file + an
; otacommand.bin, then the core's OTA stub (lib/<chip>/ota.o, always linked at
; flash offset 0) copies it into the app region at clean early-boot. ~95 KB app
; leaves ~1.5 MiB of sketch space below the FS; 512 KiB FS holds a staged image
; (~96 KB) with room to grow. See isp.cpp and docs/development/g6_01/g6_03.
board_build.filesystem_size = 512k
board_upload.maximum_size = 2097152

; PSRAM size: 8MB (both revisions use APS6404L-3SQR)
board_upload.psram_length = 8388608

; USB identity
board_build.arduino.earlephilhower.usb_manufacturer = Reiser Lab
board_build.arduino.earlephilhower.usb_vid = 0x2E8A
; USB device id
;   0x0009 = USB serial device  (flashing/debugging)
;   0x000f = USB mass storage device (bootloader mode)
board_build.arduino.earlephilhower.usb_pid = 0x0009


[env:pico_v021]
extends = common
board_build.arduino.earlephilhower.usb_product = G6 Panel v0.2
; PSRAM CS (XIP_CS1n) is on GP0 in v0.2.1
build_flags =
    -DPANEL_REV=21
    -DRP2350_PSRAM_CS=0


[env:pico_v031]
extends = common
board_build.arduino.earlephilhower.usb_product = G6 Panel v0.3
; PSRAM CS moved to GP47 in v0.3.1 to free GP0 for column 0
build_flags =
    -DPANEL_REV=31
    -DRP2350_PSRAM_CS=47


; ----------------------------------------------------------------------
; Stage 2 BCM-via-PIO self-test builds (single-panel visual validation).
;
; Adds -DSTAGE2_SELFTEST=1 which:
;   - replaces core 0 setup()/loop() with a 30-second cycle of test patterns
;     (Pattern queue is fed from core 0; no SPI peripheral init)
;   - adds a 100 µs PIO IRQ-wait timeout in Display::show() for fail-dark
;     diagnostics
;   - prints a banner on USB serial and accepts runtime commands
;     (b<float> to retune base_T, p<lr>,<lc> for single-pixel placement)
;
; Build:  pio run -e pico_v021_bcmtest   (or pico_v031_bcmtest)
; Flash:  cp -X .pio/build/<env>/firmware.uf2 /Volumes/RP2350/
;
; *** DO NOT DEPLOY *** — this binary has no SPI ingest. Re-flash a
; production env (pico_v021 / pico_v031) before any SPI bench-test.
; ----------------------------------------------------------------------

[env:pico_v021_bcmtest]
extends = env:pico_v021
build_flags =
    ${env:pico_v021.build_flags}
    -DSTAGE2_SELFTEST=1


[env:pico_v031_bcmtest]
extends = env:pico_v031
build_flags =
    ${env:pico_v031.build_flags}
    -DSTAGE2_SELFTEST=1


; ----------------------------------------------------------------------
; SPI diagnostic builds. Adds -DSPI_DIAG=1 to enable the SPI timing +
; validity-gate serial histograms in Messenger::update() (see messenger.cpp).
; Same SPI ingest as production — safe to deploy — but the per-1000-message
; Serial prints run on core 0 and can cost the occasional frame.
; ----------------------------------------------------------------------

[env:pico_v021_spidiag]
extends = env:pico_v021
build_flags =
    ${env:pico_v021.build_flags}
    -DSPI_DIAG=1


[env:pico_v031_spidiag]
extends = env:pico_v031
build_flags =
    ${env:pico_v031.build_flags}
    -DSPI_DIAG=1
