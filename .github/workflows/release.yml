# Panel-firmware release: build every selectable firmware build and publish them
# (plus a manifest catalog) as GitHub Release assets AND to this repo's GitHub
# Pages, so g6-flash (CLI) and the WebUSB flasher never need a PlatformIO
# toolchain.
#
# The build matrix below IS the catalog: each leg = one selectable build
# (rev x variant). Add a debug/feature build by adding a matrix entry — it then
# appears automatically in the flasher dropdown and as a g6-flash --variant.
# Keep `env` names in sync with panel/platformio.ini.
#
# Tag a release to trigger:   git tag panel-fw-v1.0.0 && git push origin panel-fw-v1.0.0
name: release

on:
  push:
    tags: ["panel-fw-v*"]
  workflow_dispatch: {}

permissions:
  contents: write  # create the GitHub Release + upload assets
  pages: write     # publish manifest.json + UF2s to this repo's GitHub Pages
  id-token: write  # required by actions/deploy-pages

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Production builds (deployable). v0.3.1 is the flasher's default.
          - {env: pico_v031, rev: v0.3.1, variant: production, label: "v0.3.1 — Production", usb_product: "G6 Panel v0.3", slug: g6-panel-v0.3.1}
          - {env: pico_v021, rev: v0.2.1, variant: production, label: "v0.2.1 — Production", usb_product: "G6 Panel v0.2", slug: g6-panel-v0.2.1}
          # BCM self-test builds (bench / bring-up). Auto-run a visible 60 s
          # pattern cycle + a serial console; NO SPI ingest — re-flash a
          # production build before deploying.
          - {env: pico_v031_bcmtest, rev: v0.3.1, variant: bcmtest, label: "v0.3.1 — BCM self-test", usb_product: "G6 Panel v0.3", slug: g6-panel-v0.3.1-bcmtest}
          - {env: pico_v021_bcmtest, rev: v0.2.1, variant: bcmtest, label: "v0.2.1 — BCM self-test", usb_product: "G6 Panel v0.2", slug: g6-panel-v0.2.1-bcmtest}
          # _spidiag / _psramtest stay bench-only and are intentionally NOT published.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PlatformIO drives the build; the panel build also runs
      # tools/gen_predef_patterns.py (extra_scripts) and enforces the 2 MiB cap,
      # so an oversize or broken image fails here rather than at flash time.
      - name: Install PlatformIO
        run: pip install "platformio>=6.1.19,<7"

      - name: Build ${{ matrix.env }}
        run: pio run -d panel -e ${{ matrix.env }}

      - name: Stage ${{ matrix.slug }}.uf2 + metadata
        run: |
          mkdir -p dist
          cp "panel/.pio/build/${{ matrix.env }}/firmware.uf2" "dist/${{ matrix.slug }}.uf2"
          # Per-build metadata; make_manifest.py stitches these into the catalog.
          sha=$(sha256sum "dist/${{ matrix.slug }}.uf2" | cut -d' ' -f1)
          cat > "dist/artifact-${{ matrix.slug }}.json" <<EOF
          {"rev": "${{ matrix.rev }}", "variant": "${{ matrix.variant }}",
           "env": "${{ matrix.env }}", "label": "${{ matrix.label }}",
           "file": "${{ matrix.slug }}.uf2", "sha256": "$sha",
           "usb_product": "${{ matrix.usb_product }}"}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: uf2-${{ matrix.slug }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # for .github/scripts/make_manifest.py
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Assemble manifest.json
        run: |
          mkdir -p release
          cp incoming/*/g6-panel-*.uf2 release/
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ) \
            python3 .github/scripts/make_manifest.py incoming release/manifest.json
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/g6-panel-*.uf2
            release/manifest.json
          fail_on_unmatched_files: true
          generate_release_notes: true

  # Publish the same manifest + UF2s to THIS repo's GitHub Pages. Release-asset
  # downloads are not CORS-accessible, so the browser flasher can't fetch() them;
  # this Pages site and the flasher share the reiserlab.github.io origin, so it
  # reads firmware here with no CORS. The g6-flash CLI uses the Release instead.
  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Assemble Pages site (manifest.json + UF2s)
        run: |
          mkdir -p site
          cp incoming/*/g6-panel-*.uf2 site/
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%MZ) \
            python3 .github/scripts/make_manifest.py incoming site/manifest.json
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>G6 Panel firmware</title>
          <h1>G6 Panel firmware artifacts</h1>
          <p>Machine-readable catalog: <a href="manifest.json">manifest.json</a>.
          Served same-origin for the
          <a href="https://reiserlab.github.io/webDisplayTools/flasher/">WebUSB panel flasher</a>;
          the <code>g6-flash</code> CLI pulls from the GitHub Release instead.</p>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
